[Rainmeter]
Update=1000
Group=rsm
MouseOverAction=[!SetOption "subText" "Text" "%2B total"][!Redraw]
MouseLeaveAction=[!SetOption "subText" "Text" "%1B free"][!Redraw]

[Metadata]
Name=RSM | Ram memory
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays physical memory (RAM) usage.  The secondary text normally shows the amount of RAM free; mouse over the skin to show the total amount of RAM.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\ram.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[Variables]
; Memory-specific configuration
memoryLabel=Ram
memoryUpdateDivider=3

[mUsedMemory]
Measure=PhysicalMemory
; UpdateDivider=3 - RAM usage changes quickly, update every 3 seconds
UpdateDivider=3

[mFreeMemory]
Measure=PhysicalMemory
InvertMeasure=1
; UpdateDivider=3 - RAM usage changes quickly, update every 3 seconds
UpdateDivider=3

[mTotalMemory]
Measure=PhysicalMemory
Total=1
; UpdateDivider=3600 - Total RAM changes rarely (only on hardware change), update every hour
UpdateDivider=3600

[mMemoryPercent]
Measure=Calc
Formula=(mUsedMemory / mTotalMemory) * 100
; Calculate actual percentage from bytes
; Track peak values automatically
MinValue=0
MaxValue=100

[mMemoryThreshold]
Measure=Calc
Formula=mMemoryPercent
DynamicVariables=1
; Dynamic color coding based on memory usage
; < 75% = Original color (default)
; 75-90% = Yellow (warning)
; >= 90% = Red (critical)
IfConditionMode=1
IfCondition=mMemoryPercent < 75
IfTrueAction=[!SetOption pie LineColor "#pieColor#"][!UpdateMeter pie][!Redraw]
IfCondition2=(mMemoryPercent >= 75) && (mMemoryPercent < 90)
IfTrueAction2=[!SetOption pie LineColor "255,200,100,230"][!UpdateMeter pie][!Redraw]
IfCondition3=mMemoryPercent >= 90
IfTrueAction3=[!SetOption pie LineColor "255,100,100,230"][!UpdateMeter pie][!Redraw]

@include5="#@#sharedMeters.inc"

[pie]
Meter=ROUNDLINE
MeterStyle=roundlineCommon | pieCommon
MeasureName=mMemoryPercent

[divider]
Meter=IMAGE
MeterStyle=dividerStyle | dividerCommon

[mainText]
Meter=STRING
MeterStyle=mainTextStyle | mainTextCommon
MeasureName=mMemoryPercent
Text="#memoryLabel# %1%"
ToolTipText="RAM Usage: %1%#CRLF#Min: [mMemoryPercent:MinValue]% | Max: [mMemoryPercent:MaxValue]%#CRLF#Total: [mTotalMemory:]B#CRLF#Right-click to reset peaks"
RightMouseUpAction=[!ResetStats mMemoryPercent][!UpdateMeasure mMemoryPercent][!UpdateMeter mainText][!Redraw]
DynamicVariables=1

[subText]
Meter=STRING
MeterStyle=subTextStyle | subTextCommon
MeasureName=mFreeMemory
MeasureName2=mTotalMemory
Text="%1B free"
AutoScale=1

[Icon]
Meter=Image
MeterStyle=iconStyle
ImageName=icon.png
ImageTint=#colorIcon#
