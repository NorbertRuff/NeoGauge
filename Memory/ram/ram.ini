[Rainmeter]
Update=1000
Group=rsm
MouseOverAction=[!SetOption "subText" "Text" "%2B total"][!Redraw]
MouseLeaveAction=[!SetOption "subText" "Text" "%1B free"][!Redraw]

[Metadata]
Name=RSM | Ram memory
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays physical memory (RAM) usage.  The secondary text normally shows the amount of RAM free; mouse over the skin to show the total amount of RAM.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\ram.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[Variables]
; Memory-specific configuration
memoryLabel=Ram
memoryUpdateDivider=3

[mUsedMemory]
Measure=PhysicalMemory
; UpdateDivider=3 - RAM usage changes quickly, update every 3 seconds
UpdateDivider=3
; Track peak values automatically
MinValue=0
MaxValue=100

[mFreeMemory]
Measure=PhysicalMemory
InvertMeasure=1
; UpdateDivider=3 - RAM usage changes quickly, update every 3 seconds
UpdateDivider=3

[mTotalMemory]
Measure=PhysicalMemory
Total=1
; UpdateDivider=3600 - Total RAM changes rarely (only on hardware change), update every hour
UpdateDivider=3600

@include5="#@#sharedMeters.inc"

[pie]
Meter=ROUNDLINE
MeterStyle=roundlineCommon | pieCommon
MeasureName=mUsedMemory

[divider]
Meter=IMAGE
MeterStyle=dividerStyle | dividerCommon

[mainText]
Meter=STRING
MeterStyle=mainTextStyle | mainTextCommon
MeasureName=mUsedMemory
Percentual=1
Text="#memoryLabel# %1%"

[subText]
Meter=STRING
MeterStyle=subTextStyle | subTextCommon
MeasureName=mFreeMemory
MeasureName2=mTotalMemory
Text="%1B free"
AutoScale=1

[Icon]
Meter=Image
MeterStyle=iconStyle
ImageName=icon.png
ImageTint=#colorIcon#
