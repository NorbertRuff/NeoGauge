[Rainmeter]
; Static background: drawn once, never updated
Update=-1
Group=rsm
Blur=0
OnRefreshAction=!Zpos -2

[Metadata]
Name=RSM |
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=
Version=2.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\default.txt
; Not used for its styles: an @include after the appearance file gives Rainmeter
; another variables pass, which radius (Settings.txt, from size here) needs
@include3="#@#Styles\common.inc"

[background]
Meter=IMAGE
SolidColor=#bgBarColor#
X=0
Y=0
W=((#radius#+#edging#)*2)+(#radius#*3.5)
H=#WORKAREAHEIGHT#
