[Rainmeter]
Update=1000
Group=rsm

[Variables]
componentName=RSM | CPU threads
componentInformation=Shows the load of every CPU thread as a small ring (up to 16). | Pick the layout (4 x 4, 2 x 8 or 1 x 16) and the size in the settings window: appearance > threads.
componentVersion=2.0
; Grid geometry, all in thread-ring radii (#radius# comes from threads.txt)
tCols=(#threadCols# < 1 ? 4 : #threadCols#)
tPitchX=(#radius#*2.5)
tPitchY=(#radius#*3.1)
tTop=(#radius#*2.6)
tGridW=(#edging#+(#tCols#-1)*#tPitchX#+2*#radius#)

@include0="#@#Templates\metadataTemplate.inc"
@include1=#@#Settings.txt
@include2=#@#Apparence\threads.txt
@include3="#@#Styles\common.inc"

; ============================================================
; Measures. Plain once-a-second readings: no ring animation here.

[mThreadAvg]
Measure=CPU
Processor=0

; Logical processor count, read once (16 on an 8-core / 16-thread CPU)
[mThreadCount]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Session Manager\Environment
RegValue=NUMBER_OF_PROCESSORS
UpdateDivider=-1

; Hides rings above the thread count, labels the header (runs once)
[mThreadScript]
Measure=Script
ScriptFile=#@#Scripts\ThreadGrid.lua
UpdateDivider=-1

; Warning colors as on the big gauges: yellow from 75 %, red from 90 %
[mThread1]
Measure=CPU
Processor=1
IfCondition=mThread1 >= 90
IfTrueAction=[!SetOption tArc1 LineColor "255,100,100,230"]
IfCondition2=(mThread1 >= 75) && (mThread1 < 90)
IfTrueAction2=[!SetOption tArc1 LineColor "255,200,100,230"]
IfCondition3=mThread1 < 75
IfTrueAction3=[!SetOption tArc1 LineColor "#pieColor#"]

[mThread2]
Measure=CPU
Processor=2
IfCondition=mThread2 >= 90
IfTrueAction=[!SetOption tArc2 LineColor "255,100,100,230"]
