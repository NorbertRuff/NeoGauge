; ============================================================
; Header

[Bg]
Meter=Image
X=0
Y=0
W=(#tGridW#+#edging#)
H=(#tTop#+4*#tPitchY#)
SolidColor=0,0,0,1

[mainText]
Meter=String
MeterStyle=mainTextCommon
X=#edging#
Y=(#radius#*1.3)
StringAlign=LeftBottom
FontSize=(#radius#*0.8)
MeasureName=mThreadAvg
NumOfDecimals=0
Text="threads %1%"

[subText]
Meter=String
MeterStyle=subTextCommon
X=#edging#
Y=(#radius#*1.55)
StringAlign=LeftTop
FontSize=(#radius#*0.55)
Text=" "

[divider]
Meter=Image
MeterStyle=dividerCommon
X=#edging#
Y=(#radius#*1.4)
W=(#tGridW#-#edging#)
H=(#radius#*0.1)

; ============================================================
; Rings. Thread i sits in column (i-1) % tCols, row Trunc((i-1) / tCols).
; Meter group t<i> holds one ring's meters (hidden above the thread count).

[tInner1]
Meter=Roundline
MeterStyle=roundlineCommon | innerEdgeCommon
X=(#edging#+((1-1)%#tCols#)*#tPitchX#)
Y=(#tTop#+Trunc((1-1)/#tCols#)*#tPitchY#)
Group=t1

[tTrack1]
Meter=Roundline
MeterStyle=roundlineCommon | pieBgCommon
X=(#edging#+((1-1)%#tCols#)*#tPitchX#)
Y=(#tTop#+Trunc((1-1)/#tCols#)*#tPitchY#)
Group=t1

[tOuter1]
Meter=Roundline
MeterStyle=roundlineCommon | outerEdgeCommon
X=(#edging#+((1-1)%#tCols#)*#tPitchX#)
Y=(#tTop#+Trunc((1-1)/#tCols#)*#tPitchY#)
Group=t1

[tArc1]
Meter=Roundline
MeterStyle=roundlineCommon | pieCommon
X=(#edging#+((1-1)%#tCols#)*#tPitchX#)
Y=(#tTop#+Trunc((1-1)/#tCols#)*#tPitchY#)
MeasureName=mThread1
ToolTipText="Thread 1: %1 %"
Group=t1

[tText1]
Meter=String
X=((#edging#+((1-1)%#tCols#)*#tPitchX#)+#radius#)
Y=((#tTop#+Trunc((1-1)/#tCols#)*#tPitchY#)+#radius#)
