[Rainmeter]
Update=1000
Group=rsm

[Variables]
; Metadata configuration
componentName=RSM | Processor
componentInformation=Displays the percentage load of the CPU (average of all cores), and the process that currently has the most CPU usage. | Click the main text to launch the Windows Task Manager.
componentVersion=1.0
; Measure tracked by peakTemplate.inc
peakSource=mCPU

@include0="#@#Templates\metadataTemplate.inc"
@include1=#@#Settings.txt
@include2=#@#Apparence\cpu.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[mCPU]
Measure=CPU
Processor=0
; UpdateDivider=1 - CPU load changes quickly, update every second for real-time display
; Track peak values automatically
MinValue=0
MaxValue=100

; Deprecated plugin, but UsageMonitor (its replacement: Alias=CPU, Index=1)
; crashes Rainmeter 4.5.28 on this PC.
[mTopProc]
Measure=Plugin
Plugin=AdvancedCPU
CPUExclude=Idle
TopProcess=2
; UpdateDivider=3 - Top process can change quickly, update every 3 seconds
UpdateDivider=3

[mCPUThreshold]
Measure=Calc
Formula=mCPU
DynamicVariables=1
; Dynamic color coding based on CPU load
; < 75% = Original color (default)
; 75-90% = Yellow (warning)
; >= 90% = Red (critical)
IfConditionMode=1
IfCondition=mCPU < 75
IfTrueAction=[!SetOption pie LineColor "#pieColor#"][!UpdateMeter pie]
IfCondition2=(mCPU >= 75) && (mCPU < 90)
IfTrueAction2=[!SetOption pie LineColor "255,200,100,230"][!UpdateMeter pie]
IfCondition3=mCPU >= 90
IfTrueAction3=[!SetOption pie LineColor "255,100,100,230"][!UpdateMeter pie]

@include7="#@#Templates\peakTemplate.inc"

@include5="#@#sharedMeters.inc"

[pie]
Meter=ROUNDLINE
MeterStyle=roundlineCommon | pieCommon
MeasureName=mCPU


[divider]
Meter=IMAGE
MeterStyle=dividerStyle | dividerCommon

[mainText]
Meter=STRING
MeterStyle=mainTextStyle | mainTextCommon
MeasureName=mCPU
Percentual=1
Text="CPU %1%"
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText="CPU Usage: %1%#CRLF#Min: [mPeakMin:0]% | Max: [mPeakMax:0]%#CRLF#Right-click to reset peaks"
RightMouseUpAction=#peakResetAction#
DynamicVariables=1


[subText]
Meter=STRING
MeterStyle=subTextStyle | subTextCommon
MeasureName=mTopProc
Text="top: %1"
ToolTipText=%1


[Icon]
Meter=Image
MeterStyle=iconStyle
ImageName=icon.png
ImageTint=#colorIcon#
