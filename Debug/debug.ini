[Rainmeter]
Update=1000
Group=rsm

[Metadata]
Name=NeoGauge | Debug Component
Author=Norbert Ruff | Flying Hyrax
Information=Debug component to test measure values and conditions. Set debugMeasure variable to the measure name you want to debug.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt

[Variables]
; ============================================================
; Debug Configuration
; Choose which component to debug by uncommenting one section below
; ============================================================
debugType=disk
debugLabel=Disk Usage (C:)
debugThreshold1=75
debugThreshold2=90

; For disk debugging
debugDrive=C

; For CPU/Memory debugging (already defined by Windows measures)
; No additional config needed

; Background
[Background]
Meter=Image
W=450
H=400
SolidColor=20,20,20,255
X=0
Y=0

; Title
[Title]
Meter=String
X=10
Y=10
FontSize=14
FontColor=255,255,255,255
FontFace=Arial
Text="Debug Component - [&debugMeasure]"
DynamicVariables=1
AntiAlias=1

[Label]
Meter=String
X=10
Y=35
FontSize=11
FontColor=200,200,200,255
FontFace=Arial
Text="#debugLabel# (Type: #debugType#)"
AntiAlias=1

; ============================================================
; Actual Measures to Debug
; ============================================================

; Disk Measure
[mUsedDisk]
Measure=FreeDiskSpace
Drive=#debugDrive#:
InvertMeasure=1
Disabled=(#debugType# <> "disk")

; CPU Measure
[mCPU]
Measure=CPU
Processor=0
Disabled=(#debugType# <> "cpu")

; Memory Measure
[mUsedMemory]
Measure=PhysicalMemory
Disabled=(#debugType# <> "memory")

; Temperature Measure (from HWiNFO)
[mTemp]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=#cpuTemp1#
Substitute="Unknown":"N/A","-1":"N/A","":"N/A"
Disabled=(#debugType# <> "temp")

[Separator1]
Meter=String
X=10
Y=55
FontSize=10
FontColor=100,100,100,255
FontFace=Consolas
Text="--------------"
AntiAlias=1

; Raw Measure Value
[RawValueLabel]
Meter=String
X=10
Y=75
FontSize=11
FontColor=150,255,150,255
FontFace=Arial
Text="Raw Measure Value:"
AntiAlias=1

[RawValue]
Meter=String
X=10
Y=95
FontSize=12
FontColor=100,255,100,255
FontFace=Consolas
MeasureName=mUsedDisk
MeasureName2=mCPU
MeasureName3=mUsedMemory
MeasureName4=mTemp
Text="#debugType#: %1 | %2 | %3 | %4"
NumOfDecimals=10
DynamicVariables=1
AntiAlias=1

; Calculated Values
[CalcLabel]
Meter=String
X=10
Y=125
FontSize=11
FontColor=150,255,255,255
FontFace=Arial
Text="Calculated Values:"
AntiAlias=1

[mCalcTest]
Measure=Calc
Formula=((#debugType# = "disk") ? mUsedDisk : ((#debugType# = "cpu") ? mCPU : ((#debugType# = "memory") ? mUsedMemory : mTemp)))
DynamicVariables=1

[mCalcTest100]
Measure=Calc
Formula=(mCalcTest * 100)
DynamicVariables=1

[CalcValue1]
Meter=String
X=10
Y=145
FontSize=11
FontColor=100,255,255,255
FontFace=Consolas
MeasureName=mCalcTest
Text="Calc(measure): %1"
NumOfDecimals=10
DynamicVariables=1
AntiAlias=1

[CalcValue2]
Meter=String
X=10
Y=165
FontSize=11
FontColor=255,200,100,255
FontFace=Consolas
MeasureName=mCalcTest100
Text="Calc(measure * 100): %1"
NumOfDecimals=2
DynamicVariables=1
AntiAlias=1

[Separator2]
Meter=String
X=10
Y=190
FontSize=10
FontColor=100,100,100,255
FontFace=Consolas
Text="--------------"
AntiAlias=1

; Condition Testing
[ConditionLabel]
Meter=String
X=10
Y=210
FontSize=11
FontColor=255,200,100,255
FontFace=Arial
Text="Condition Tests:"
AntiAlias=1

[mConditionTest1]
Measure=Calc
Formula=mCalcTest
DynamicVariables=1
IfCondition=mConditionTest1 < #debugThreshold1#
IfTrueAction=[!SetVariable condition1Result "TRUE"][!SetVariable condition1Color "100,255,100"]
IfFalseAction=[!SetVariable condition1Result "FALSE"][!SetVariable condition1Color "255,100,100"]

[mConditionTest2]
Measure=Calc
Formula=mCalcTest
DynamicVariables=1
IfCondition=(mConditionTest2 >= #debugThreshold1#) && (mConditionTest2 < #debugThreshold2#)
IfTrueAction=[!SetVariable condition2Result "TRUE"][!SetVariable condition2Color "255,200,100"]
IfFalseAction=[!SetVariable condition2Result "FALSE"][!SetVariable condition2Color "150,150,150"]

[mConditionTest3]
Measure=Calc
Formula=mCalcTest
DynamicVariables=1
IfCondition=mConditionTest3 >= #debugThreshold2#
IfTrueAction=[!SetVariable condition3Result "TRUE"][!SetVariable condition3Color "255,100,100"]
IfFalseAction=[!SetVariable condition3Result "FALSE"][!SetVariable condition3Color "150,150,150"]

[Condition1]
Meter=String
X=10
Y=230
FontSize=10
FontColor=[condition1Color]
FontFace=Consolas
Text="< #debugThreshold1#: [condition1Result]"
DynamicVariables=1
AntiAlias=1

[Condition2]
Meter=String
X=10
Y=250
FontSize=10
FontColor=[condition2Color]
FontFace=Consolas
Text="#debugThreshold1# <= x < #debugThreshold2#: [condition2Result]"
DynamicVariables=1
AntiAlias=1

[Condition3]
Meter=String
X=10
Y=270
FontSize=10
FontColor=[condition3Color]
FontFace=Consolas
Text=">= #debugThreshold2#: [condition3Result]"
DynamicVariables=1
AntiAlias=1

[Separator3]
Meter=String
X=10
Y=295
FontSize=10
FontColor=100,100,100,255
FontFace=Consolas
Text="--------------"
AntiAlias=1

; Expected Result
[ResultLabel]
Meter=String
X=10
Y=315
FontSize=11
FontColor=255,100,255,255
FontFace=Arial
Text="Expected Color:"
AntiAlias=1

[mResultCalc]
Measure=Calc
Formula=mCalcTest
DynamicVariables=1
IfCondition=mResultCalc < #debugThreshold1#
IfTrueAction=[!SetVariable expectedColor "Original Color (#pieColor#)"][!SetVariable expectedColorCode "100,255,100"]
IfCondition2=(mResultCalc >= #debugThreshold1#) && (mResultCalc < #debugThreshold2#)
IfTrueAction2=[!SetVariable expectedColor "Yellow (Warning)"][!SetVariable expectedColorCode "255,200,100"]
IfCondition3=mResultCalc >= #debugThreshold2#
IfTrueAction3=[!SetVariable expectedColor "Red (Critical)"][!SetVariable expectedColorCode "255,100,100"]

[ExpectedResult]
Meter=String
X=10
Y=335
FontSize=11
FontColor=[expectedColorCode]
FontFace=Consolas
Text="[expectedColor]"
DynamicVariables=1
AntiAlias=1
W=430
ClipString=2

; Instructions
[Instructions]
Meter=String
X=10
Y=365
FontSize=9
FontColor=150,150,150,255
FontFace=Arial
Text="Edit debugType variable: disk, cpu, memory, or temp"
AntiAlias=1
W=430
ClipString=2

[Instructions2]
Meter=String
X=10
Y=380
FontSize=9
FontColor=150,150,150,255
FontFace=Arial
Text="For disk: also set debugDrive variable (C, D, E, etc.)"
AntiAlias=1
W=430
ClipString=2

