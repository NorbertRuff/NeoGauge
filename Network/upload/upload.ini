[Rainmeter]
Update=1000
Group=rsm

[Metadata]
Name=RSM | Nic Upload
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays outbound/upload traffic over the computer's network interface card, relative to a user specified maximum. | Mouse over the main text to display your computer's LAN IP address in a tooltip. | Adjust the maximum upload speed of your network connection in the Settings.ini skin.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\networkUp.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[Variables]
; Network-specific configuration
networkMaxVar=#uploadMax#
networkLabel=up
networkIpMeasure=mLanIp
networkIpLabel=lan

[mNetwork]
Measure=NetOut
Interface=0
; UpdateDivider=1 - Network speed changes quickly, update every second for real-time display
; Track peak values automatically
MinValue=0

[mLanIp]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=0
Substitute="":"n/a"
; UpdateDivider=3600 - LAN IP changes rarely, update every hour
UpdateDivider=3600

@include6="#@#Templates\networkTemplate.inc"
