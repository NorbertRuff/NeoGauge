[Rainmeter]
Update=1000
Group=rsm
AccurateText=1

[Variables]
; Metadata configuration
componentName=NeoGauge | Settings
componentInformation=Change how NeoGauge looks and what it measures. | "appearance" edits one appearance file at a time (pick it at the top); every skin that uses that file changes with it. | "system" holds display scale, fonts, drives, network speeds and the recycle bin. | "time" holds the clock settings.
componentVersion=2.0

; Current page (info | appearance | system | time) and the appearance file being edited
page=system
component=cpu
appFile=#@#Apparence\#component#.txt

; Config window colors (each page sets its own accent as pageColor)
textColor=235,235,235,230
dimColor=150,150,150,140
lineColor=255,255,255,28
bgColor=14,14,18,250
pageColor=89,186,255,230

; Window size at 100% display scale; every position below is multiplied by #s#
bgW=580
bgH=540
s=#scale#
; Text box size in pixels; Settings.lua recomputes these from the scale
inFont=10
inW=180
inH=20

@include0="#@#Templates\metadataTemplate.inc"
@include1=#@#Settings.txt
@include2=#@#Apparence\#component#.txt

; ============================================================
; Measures

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

; One text box for every editable value. Each command opens it on top of the
; text it edits ([meter:X] etc.), which needs DynamicVariables=1.
; inFont / inH are set by Settings.lua so they follow the display scale.
[mInput]
Measure=Plugin
Plugin=InputText
DynamicVariables=1
SolidColor=40,40,48,255
FontColor=#textColor#
FontFace=Segoe UI
FontSize=#inFont#
StringAlign=Left
FocusDismiss=1
W=#inW#
H=#inH#
Command1=[!WriteKeyValue Variables pieColor "$UserInput$" "#appFile#"][!RefreshGroup rsm] DefaultValue="#pieColor#" X=[c1Text:X] Y=[c1Text:Y]
Command2=[!WriteKeyValue Variables innerRingColor "$UserInput$" "#appFile#"][!RefreshGroup rsm] DefaultValue="#innerRingColor#" X=[c2Text:X] Y=[c2Text:Y]
Command3=[!WriteKeyValue Variables pieBgColor "$UserInput$" "#appFile#"][!RefreshGroup rsm] DefaultValue="#pieBgColor#" X=[c3Text:X] Y=[c3Text:Y]
Command4=[!WriteKeyValue Variables size "$UserInput$" "#appFile#"][!RefreshGroup rsm] DefaultValue="#size#" X=[opt_size_custom:X] Y=[opt_size_custom:Y]
Command5=[!WriteKeyValue Variables edging "(#*radius*#*$UserInput$)" "#appFile#"][!RefreshGroup rsm] DefaultValue="0.15" X=[opt_edging_custom:X] Y=[opt_edging_custom:Y]
Command6=[!WriteKeyValue Variables hd1 "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#hd1#" X=[hd1:X] Y=[hd1:Y]
Command7=[!WriteKeyValue Variables hd2 "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#hd2#" X=[hd2:X] Y=[hd2:Y]
Command8=[!WriteKeyValue Variables hd3 "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#hd3#" X=[hd3:X] Y=[hd3:Y]
Command9=[!WriteKeyValue Variables hd4 "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#hd4#" X=[hd4:X] Y=[hd4:Y]
Command10=[!WriteKeyValue Variables hd5 "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#hd5#" X=[hd5:X] Y=[hd5:Y]
Command11=[!CommandMeasure mScript "setNetworkSpeed('uploadMax', '$UserInput$')"][!RefreshGroup rsm] X=[uploadMax:X] Y=[uploadMax:Y]
Command12=[!CommandMeasure mScript "setNetworkSpeed('downloadMax', '$UserInput$')"][!RefreshGroup rsm] X=[downloadMax:X] Y=[downloadMax:Y]
Command13=[!WriteKeyValue Variables timeFormat "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#timeFormat#" X=[timeFormat:X] Y=[timeFormat:Y]
Command14=[!WriteKeyValue Variables dateFormat "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue=#dateFormat# X=[dateFormat:X] Y=[dateFormat:Y]
Command15=[!WriteKeyValue Variables scale "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#scale#" X=[opt_scale_custom:X] Y=[opt_scale_custom:Y]
Command16=[!WriteKeyValue Variables mainFont "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#mainFont#" X=[mainFont:X] Y=[mainFont:Y]
Command17=[!WriteKeyValue Variables subFont "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#subFont#" X=[subFont:X] Y=[subFont:Y]
Command18=[!WriteKeyValue Variables fanMaxRpm "$UserInput$" "#@#Settings.txt"][!RefreshGroup rsm] DefaultValue="#fanMaxRpm#" X=[fanMaxRpm:X] Y=[fanMaxRpm:Y]

; ============================================================
; Styles

[sText]
AntiAlias=1
FontFace=#mainFont#
FontSize=(11*#s#)
FontColor=#textColor#
SolidColor=0,0,0,1

[sNav]
FontSize=(13*#s#)
StringAlign=Right
X=(112*#s#)
Y=(8*#s#)R

[sHeader]
FontSize=(13*#s#)
FontColor=#pageColor#
X=(140*#s#)

; An option directly under a header
[sFirst]
X=(140*#s#)
Y=(3*#s#)R

; An option to the right of the previous one
[sNext]
X=(14*#s#)R
Y=r

[sNote]
FontFace=Segoe UI
FontSize=(9*#s#)
FontColor=#dimColor#

; ============================================================
; Window

[bg]
Meter=Shape
Shape=Rectangle (0.5*#s#),(0.5*#s#),((#bgW#-1)*#s#),((#bgH#-1)*#s#),(10*#s#) | Fill Color #bgColor# | StrokeWidth (1*#s#) | Stroke Color #lineColor#
Shape2=Line (124*#s#),(16*#s#),(124*#s#),((#bgH#-16)*#s#) | StrokeWidth (1*#s#) | Stroke Color #lineColor#

[close]
Meter=String
MeterStyle=sText
FontSize=(12*#s#)
FontColor=#dimColor#
StringAlign=Right
X=((#bgW#-14)*#s#)
Y=(10*#s#)
Text=x
ToolTipText=Close settings
LeftMouseUpAction=[!DeactivateConfig]

; ============================================================
; Navigation (Settings.lua highlights the current page)

[opt_page_info]
Meter=String
MeterStyle=sText | sNav
Y=(24*#s#)
Text=info
LeftMouseUpAction=[!WriteKeyValue Variables page info][!Refresh]

[opt_page_appearance]
Meter=String
MeterStyle=sText | sNav
Text=appearance
LeftMouseUpAction=[!WriteKeyValue Variables page appearance][!Refresh]

[opt_page_system]
Meter=String
MeterStyle=sText | sNav
Text=system
LeftMouseUpAction=[!WriteKeyValue Variables page system][!Refresh]

[opt_page_time]
Meter=String
MeterStyle=sText | sNav
Text=time
LeftMouseUpAction=[!WriteKeyValue Variables page time][!Refresh]

[readme]
Meter=String
MeterStyle=sText | sNote
FontSize=(10*#s#)
StringAlign=Right
X=(112*#s#)
Y=((#bgH#-64)*#s#)
Text=readme
ToolTipText=Open ReadMe.md
LeftMouseUpAction=["#ROOTCONFIGPATH#ReadMe.md"]

[editFiles]
Meter=String
MeterStyle=sText | sNote
FontSize=(10*#s#)
StringAlign=Right
X=(112*#s#)
Y=(6*#s#)R
Text=edit files
ToolTipText=Open Settings.txt and the current appearance file in your text editor
LeftMouseUpAction=["#@#Settings.txt"]["#appFile#"]

; ============================================================
; Current page

@include3="#@#ConfigPages\#page#.inc"
