[Rainmeter]
Update=1000
Group=rsm

[Metadata]
Name=RSM
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays system uptime. | This component shows how long your system has been running since the last boot.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\networkDown.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[MeasureUpTime]
Measure=UpTime
Format="%4!i!d %3!i!h %2!i!m"
AddDaysToHours=0

[divider]
Meter=IMAGE
W=60
MeterStyle=dividerStyle | dividerCommon

[mainText]
Meter=STRING
FontColor=255,255,255,255
FontSize=13
MeterStyle=mainTextStyle | mainTextCommon
MeasureName=MeasureUpTime

[subText]
Meter=STRING
FontSize=10
MeterStyle=subTextStyle | subTextCommon
Text="Uptime"
