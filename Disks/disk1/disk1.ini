[Rainmeter]
Update=1000
Group=rsm
MouseOverAction=[!SetOption "subText" "Text" "#*textB*#"][!Redraw]
MouseLeaveAction=[!SetOption "subText" "Text" "#*textA*#"][!Redraw]

[Variables]
; Metadata configuration
componentName=RSM | Hard drive 1
componentInformation=Shows used (percentage) and free (numeric) disk space for the specified hard drive. | Mouse over the skin to show total disk space, and click the main text to open the drive in Windows Explorer. | You can change which hard drives are measured in the Settings.ini skin. | By default, disk 1 will not recognize removable drives, and has higher update rates (to reduce overall disk load).
componentVersion=1.0

; Disk-specific configuration
diskDrive=#hd1#
diskUpdateDivider=120
diskIgnoreRemovable=1
diskTotalUpdateDivider=3600
diskLabelUpdateDivider=3600
diskTypeUpdateDivider=5

@include0="#@#Templates\metadataTemplate.inc"
@include1=#@#Settings.txt
@include2=#@#Apparence\disk.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

@include6="#@#Templates\diskTemplate.inc"
