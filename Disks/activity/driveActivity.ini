[Rainmeter]
Update=1000
Group=rsm

[Metadata]
Name=RSM | Hard drive activity
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays how busy the disks are and the disk traffic per second from Windows Performance Monitor. | By default, the skin averages across all physical disks.  To watch one disk, change Name=_Total to that disk's instance (e.g. "0 C:") in the skin.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\io.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

; Busy % = 100 - idle %. "% Disk Time" is not used because it can go far
; above 100 when several requests are queued.
; PerfMon returns the raw counter: idle time in 100 ns ticks since the last
; update. With Update=1000 a fully idle disk gives 10,000,000 ticks, so
; ticks / 100000 = idle %. (UsageMonitor returns ready percentages but
; crashes Rainmeter 4.5.28 on this PC.)
[mDiskIdle]
Measure=Plugin
Plugin=PerfMon
PerfMonObject=PhysicalDisk
PerfMonCounter=% Idle Time
PerfMonInstance=_Total

[mScaleDiskTime]
Measure=Calc
Formula=Clamp(100 - mDiskIdle / 100000, 0, 100)
MinValue=0
MaxValue=100

; Raw counter difference = bytes moved since the last update (1 s)
[mDiskBytesRaw]
Measure=Plugin
Plugin=PerfMon
PerfMonObject=PhysicalDisk
PerfMonCounter=Disk Bytes/sec
PerfMonInstance=_Total

; Plugin measures can carry a string value that a String meter would print
; instead of the number. A Calc has no string value.
[mDiskBytesSec]
Measure=Calc
Formula=mDiskBytesRaw

[Variables]
; Ring (ringTemplate.inc)
fxSource=mScaleDiskTime
fxMax=100
fxLevels=1

@include5="#@#Templates\ringTemplate.inc"

[divider]
Meter=IMAGE
MeterStyle=dividerStyle | dividerCommon

[mainText]
Meter=STRING
MeterStyle=mainTextStyle | mainTextCommon
MeasureName=mScaleDiskTime
NumOfDecimals=1
Text="I/O %1%"

[subText]
Meter=STRING
MeterStyle=subTextStyle | subTextCommon
MeasureName=mDiskBytesSec
AutoScale=1
Text="%1B/s"


[Icon]
Meter=Image
MeterStyle=iconStyle
ImageName=icon.png
ImageTint=#colorIcon#
