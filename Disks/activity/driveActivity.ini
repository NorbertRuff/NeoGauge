[Rainmeter]
Update=1000
Group=rsm

[Metadata]
Name=RSM | Hard drive activity
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays how busy the disks are and the disk traffic per second from Windows Performance Monitor. | By default, the skin averages across all physical disks.  To watch one disk, change Name=_Total to that disk's instance (e.g. "0 C:") in the skin.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\io.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

; Busy % = 100 - idle %. "% Disk Time" is not used because it can go far
; above 100 when several requests are queued.
; UsageMonitor skips _Total by default, so Blacklist only excludes Idle here.
[mDiskIdle]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=% Idle Time
Name=_Total
Blacklist=Idle

[mScaleDiskTime]
Measure=Calc
Formula=Clamp(100 - mDiskIdle, 0, 100)
MinValue=0
MaxValue=100

[mDiskBytesRaw]
Measure=Plugin
Plugin=UsageMonitor
Category=PhysicalDisk
Counter=Disk Bytes/sec
Name=_Total
Blacklist=Idle

; UsageMonitor's string value is the instance name ("_Total"), which a
; String meter would print instead of the number. A Calc has no string value.
[mDiskBytesSec]
Measure=Calc
Formula=mDiskBytesRaw

@include5="#@#sharedMeters.inc"

[pie]
Meter=ROUNDLINE
MeterStyle=roundlineCommon | pieCommon
MeasureName=mScaleDiskTime

[divider]
Meter=IMAGE
MeterStyle=dividerStyle | dividerCommon

[mainText]
Meter=STRING
MeterStyle=mainTextStyle | mainTextCommon
MeasureName=mScaleDiskTime
NumOfDecimals=1
Text="I/O %1%"

[subText]
Meter=STRING
MeterStyle=subTextStyle | subTextCommon
MeasureName=mDiskBytesSec
AutoScale=1
Text="%1B/s"


[Icon]
Meter=Image
MeterStyle=iconStyle
ImageName=icon.png
ImageTint=#colorIcon#
