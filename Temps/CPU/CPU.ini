[Rainmeter]
Update=1000
Group=rsm

[Variables]
; Metadata configuration
componentName=RSM | CPU Temperature
componentInformation=Displays CPU temperature using HWiNFO64. HWiNFO64 must be running with Shared Memory support enabled. | You will need to edit the cpuTemp1 and cpuTemp2 variables in "@Resources\Settings.txt" to tell the skin which sensors to display.
componentVersion=1.0

; Temperature-specific configuration
tempRegValue=#cpuTemp1#
tempLabel=#cpuTemp1Label#
tempPercentFormula=(mTemp/100)

[mTemp2]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=#cpuTemp2#
; UpdateDivider=5 - Temperature changes slowly, update every 5 seconds
; Track peak values automatically
MinValue=0
MaxValue=100
; Handle missing or invalid sensor values gracefully
Substitute="Unknown":"N/A","-1":"N/A","":"N/A"

@include0="#@#Templates\metadataTemplate.inc"
@include1=#@#Settings.txt
@include2=#@#Apparence\fan.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

@include6="#@#Templates\tempTemplate.inc"

[mainText]
MeasureName2=mTemp2
