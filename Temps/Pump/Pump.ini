[Rainmeter]
Update=1000
Group=rsm
MouseOverAction=[!SetOption "mainText" "Text" "%2"][!Redraw]
MouseLeaveAction=[!SetOption "mainText" "Text" "%1"][!Redraw]

[Metadata]
Name=RSM | Pump
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays pump temperature and RPM using HWiNFO64. HWiNFO64 must be running with Shared Memory support enabled. | You will need to edit the pumpTemp and pumpRpm variables in "@Resources\Settings.txt" to tell the skin which sensors to display.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\fan.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[Variables]
; Temperature-specific configuration
tempRegValue=#pumpTemp#
tempLabel=#pumpLabel#
tempPercentFormula=(mTemp/100)

[mRpm]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=#pumpRpm#
; UpdateDivider=3 - Pump RPM can change quickly, update every 3 seconds
; Track peak values automatically
MinValue=0
MaxValue=5000
; Handle missing or invalid sensor values gracefully
Substitute="Unknown":"N/A","-1":"N/A","":"N/A"

@include6="#@#Templates\tempTemplate.inc"

[mainText]
MeasureName2=mRpm
