[Rainmeter]
Update=1000
Group=rsm
MouseOverAction=[!SetOption "mainText" "Text" "%2"][!Redraw]
MouseLeaveAction=[!SetOption "mainText" "Text" "%1"][!Redraw]

[Metadata]
Name=RSM | GPU Temperature
Author=Norbert Ruff | Flying Hyrax | flyinghyrax.deviantart.com
Information=Displays GPU temperature and RPM using HWiNFO64. HWiNFO64 must be running with Shared Memory support enabled. | You will need to edit the gpuTemp and gpuRpm variables in "@Resources\Settings.txt" to tell the skin which sensors to display.
Version=1.0
License=Creative Commons BY-NC-SA 3.0

@include1=#@#Settings.txt
@include2=#@#Apparence\fan.txt

@include3="#@#Styles\common.inc"
@include4="#@#Styles\#orient#.inc"

[Variables]
; Temperature-specific configuration
tempRegValue=#gpuTemp#
tempLabel=#gpuTempLabel#
tempPercentFormula=(mTemp/100)

[mRpm]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=#gpuRpm#

@include6="#@#Templates\tempTemplate.inc"

[mainText]
MeasureName2=mRpm
